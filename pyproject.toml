[project]
name = "wbw-daemon"
version = "0.1.0"
description = "Python SDK Application for Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-antigravity",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
